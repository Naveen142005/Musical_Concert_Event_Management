<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Thigalzhi® Concert Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        .font-display { font-family: 'Outfit', sans-serif; }
        .font-body { font-family: 'DM Sans', sans-serif; }
        
        .card-elegant {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px rgba(147, 51, 234, 0.1), 
                        0 4px 12px rgba(0, 0, 0, 0.05);
        }
        
        .gentle-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px rgba(147, 51, 234, 0.15), 
                        0 6px 16px rgba(0, 0, 0, 0.08);
        }
        
        .profile-avatar {
            background: linear-gradient(135deg, #9333EA, #7C3AED);
        }
        
        .input-focus:focus {
            border-color: #9333EA;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        @media (max-width: 768px) {
            * { cursor: auto !important; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-50 to-purple-50 min-h-screen font-body">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-xl border-b border-purple-100 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <!-- Back Button and Title -->
                <div class="flex items-center space-x-4" onclick="redirect()">
                    <button onclick="goBack()" class="w-10 h-10 bg-purple-100 rounded-full flex items-center justify-center hover:bg-purple-200 transition-colors duration-200 group">
                        <svg class="w-5 h-5 text-purple-600 group-hover:text-purple-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                        </svg>
                    </button>
                    <div>
                        <h1 class="text-2xl md:text-3xl font-display font-bold bg-gradient-to-r from-gray-900 to-purple-600 bg-clip-text text-transparent">
                            My Profile
                        </h1>
                        <p class="text-sm text-slate-600 font-medium">Manage your account settings</p>
                    </div>
                </div>
                
                <!-- Save Button -->
                <button onclick="saveProfile()" class="hidden sm:flex items-center px-6 py-3 bg-gradient-to-r from-purple-600 to-purple-700 text-white font-semibold rounded-xl hover:shadow-lg hover:shadow-purple-500/30 transition-all duration-300">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    Save Changes
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Profile Header -->
        <div class="card-elegant gentle-hover rounded-3xl p-8 mb-8 transition-all duration-300">
            <div class="flex flex-col md:flex-row items-center md:items-start space-y-6 md:space-y-0 md:space-x-8">
                <!-- Profile Avatar -->
                <div class="relative">
                    <div class="w-32 h-32 profile-avatar rounded-full flex items-center justify-center text-white text-4xl font-display font-bold shadow-xl">
                        <span id="avatarInitials">AU</span>
                    </div>
                    <button class="absolute bottom-2 right-2 w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center hover:bg-slate-50 transition-colors">
                        <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </button>
                </div>
                
                <!-- Profile Info -->
                <div class="flex-1 text-center md:text-left">
                    <h2 class="text-3xl font-display font-bold text-slate-900 mb-2" id="displayName">Audience User</h2>
                    <p class="text-lg text-slate-600 mb-2" id="displayEmail">user@example.com</p>
                    <div class="flex flex-wrap justify-center md:justify-start gap-2 mb-4">
                        <span class="px-3 py-1 bg-purple-100 text-purple-700 text-sm font-medium rounded-full">Thigalzhi Member</span>
                        <span class="px-3 py-1 bg-green-100 text-green-700 text-sm font-medium rounded-full" id="memberSince">Member since Sep 2025</span>
                    </div>
                    <div class="grid grid-cols-3 gap-4 text-center">
                        <div>
                            <div class="text-2xl font-bold text-purple-600" id="totalBookings">8</div>
                            <div class="text-sm text-slate-600">Total Bookings</div>
                        </div>
                        <div>
                            <div class="text-2xl font-bold text-purple-600" id="upcomingEvents">2</div>
                            <div class="text-sm text-slate-600">Upcoming</div>
                        </div>
                        <div>
                            <div class="text-2xl font-bold text-purple-600" id="totalSpent">₹25,400</div>
                            <div class="text-sm text-slate-600">Total Spent</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Profile Form -->
        <form id="profileForm" class="space-y-8">
            
            <!-- Personal Information -->
            <div class="card-elegant gentle-hover rounded-3xl p-8 transition-all duration-300">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center mr-4">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                    </div>
                    <h3 class="text-2xl font-display font-bold text-slate-900">Personal Information</h3>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">First Name</label>
                        <input type="text" id="firstName" name="firstName" value="John" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white" placeholder="Enter your first name">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">Last Name</label>
                        <input type="text" id="lastName" name="lastName" value="Doe" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white" placeholder="Enter your last name">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">Email Address</label>
                        <input type="email" id="email" name="email" value="john.doe@example.com" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white" placeholder="Enter your email">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">Phone Number</label>
                        <input type="tel" id="phone" name="phone" value="+91 98765 43210" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white" placeholder="Enter your phone number">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">Date of Birth</label>
                        <input type="date" id="dob" name="dob" value="1995-06-15" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">Gender</label>
                        <select id="gender" name="gender" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white">
                            <option value="">Select Gender</option>
                            <option value="male" selected>Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                            <option value="prefer_not_to_say">Prefer not to say</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Address Information -->
            <div class="card-elegant gentle-hover rounded-3xl p-8 transition-all duration-300">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center mr-4">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                        </svg>
                    </div>
                    <h3 class="text-2xl font-display font-bold text-slate-900">Address Information</h3>
                </div>
                
                <div class="grid grid-cols-1 gap-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">Street Address</label>
                        <input type="text" id="address" name="address" value="123 Music Street, Entertainment District" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white" placeholder="Enter your street address">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-3">City</label>
                            <input type="text" id="city" name="city" value="Mumbai" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white" placeholder="Enter your city">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-3">State</label>
                            <input type="text" id="state" name="state" value="Maharashtra" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white" placeholder="Enter your state">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-3">PIN Code</label>
                            <input type="text" id="pincode" name="pincode" value="400001" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white" placeholder="Enter PIN code">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Preferences -->
            <div class="card-elegant gentle-hover rounded-3xl p-8 transition-all duration-300">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center mr-4">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                        </svg>
                    </div>
                    <h3 class="text-2xl font-display font-bold text-slate-900">Music Preferences</h3>
                </div>
                
                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">Favorite Music Genres</label>
                        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="genres" value="classical" checked class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Classical</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="genres" value="rock" checked class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Rock</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="genres" value="pop" class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Pop</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="genres" value="jazz" checked class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Jazz</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="genres" value="electronic" class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Electronic</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="genres" value="indie" class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Indie</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="genres" value="acoustic" class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Acoustic</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer">
                                <input type="checkbox" name="genres" value="fusion" class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Fusion</span>
                            </label>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-3">Notification Preferences</label>
                        <div class="space-y-3">
                            <label class="flex items-center space-x-3 cursor-pointer">
                                <input type="checkbox" name="notifications" value="new_events" checked class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Notify me about new events</span>
                            </label>
                            <label class="flex items-center space-x-3 cursor-pointer">
                                <input type="checkbox" name="notifications" value="booking_updates" checked class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Send booking updates</span>
                            </label>
                            <label class="flex items-center space-x-3 cursor-pointer">
                                <input type="checkbox" name="notifications" value="promotions" class="text-purple-600 focus:ring-purple-600 rounded">
                                <span class="text-sm text-slate-700">Promotional offers and discounts</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Security Settings -->
            <div class="card-elegant gentle-hover rounded-3xl p-8 transition-all duration-300">
                <div class="flex items-center mb-6">
                    <div class="w-10 h-10 bg-purple-100 rounded-xl flex items-center justify-center mr-4">
                        <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                    </div>
                    <h3 class="text-2xl font-display font-bold text-slate-900">Security Settings</h3>
                </div>
                
                <div class="space-y-6">
                    <div class="bg-slate-50 rounded-xl p-6">
                        <h4 class="font-semibold text-slate-900 mb-3">Change Password</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">Current Password</label>
                                <input type="password" id="currentPassword" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white" placeholder="Enter current password">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-2">New Password</label>
                                <input type="password" id="newPassword" class="w-full px-4 py-3 border border-slate-200 rounded-xl input-focus transition-all duration-200 bg-white" placeholder="Enter new password">
                            </div>
                        </div>
                        <button type="button" onclick="changePassword()" class="mt-4 px-6 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors">
                            Update Password
                        </button>
                    </div>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4">
                <button type="button" onclick="saveProfile()" class="flex-1 bg-gradient-to-r from-purple-600 to-purple-700 text-white py-4 px-6 rounded-xl font-semibold hover:shadow-lg hover:shadow-purple-500/30 transition-all duration-300 flex items-center justify-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                    </svg>
                    Save Changes
                </button>
                <button type="button" onclick="resetForm()" class="sm:w-auto px-6 py-4 border border-slate-300 text-slate-700 rounded-xl font-semibold hover:bg-slate-50 transition-colors">
                    Reset Changes
                </button>
            </div>
        </form>
    </main>

    <script src="profile.js"></script>
    <script>
        feather.replace();
    </script>
</body>
</html>
