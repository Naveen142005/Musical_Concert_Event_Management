<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="width: 100vw; height: 100vh;">
    <button onclick="showIframe()">Show HTML in iframe</button>
    <iframe
      id="htmlFrame"
      src=""
      style="
        position: absolute;
        top: 0;
        display: none;
        width: 99%;
        height: 90%;
        background: transparent;
        border: none;
        overflow: hidden;
      "
    ></iframe>

    <script>
      function showIframe() {
        const iframe = document.getElementById("htmlFrame");
        iframe.src = "/src/User/login_signup.html";
        iframe.style.display = "block";
      }
    </script>
  </body>
</html>
