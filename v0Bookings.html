<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Bookings - Thigazhi Concert Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'background': '#ffffff',
                        'foreground': '#1f2937',
                        'card': '#ffffff',
                        'card-foreground': '#1f2937',
                        'primary': '#7c3aed',
                        'primary-foreground': '#ffffff',
                        'secondary': '#f3f4f6',
                        'secondary-foreground': '#374151',
                        'muted': '#f9fafb',
                        'muted-foreground': '#6b7280',
                        'accent': '#e5e7eb',
                        'accent-foreground': '#374151',
                        'destructive': '#ef4444',
                        'destructive-foreground': '#ffffff',
                        'border': '#e5e7eb',
                        'input': '#f9fafb',
                        'ring': '#7c3aed',
                        'success': '#10b981',
                        'warning': '#f59e0b'
                    },
                    fontFamily: {
                        'sans': ['Inter', 'system-ui', 'sans-serif']
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-in-out',
                        'slide-up': 'slideUp 0.3s ease-out',
                        'scale-in': 'scaleIn 0.2s ease-out',
                        'counter': 'counter 2s ease-out',
                        'slide-down': 'slideDown 0.3s ease-out',
                        'bounce-in': 'bounceIn 0.6s ease-out',
                        'pulse': 'pulse 2s infinite'
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        scaleIn: {
                            '0%': { transform: 'scale(0.95)', opacity: '0' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        },
                        counter: {
                            '0%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.1)' },
                            '100%': { transform: 'scale(1)' }
                        },
                        slideDown: {
                            '0%': { transform: 'translateY(-20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        bounceIn: {
                            '0%': { transform: 'scale(0.3)', opacity: '0' },
                            '50%': { transform: 'scale(1.05)' },
                            '70%': { transform: 'scale(0.9)' },
                            '100%': { transform: 'scale(1)', opacity: '1' }
                        }
                    }
                }
            }
        };
    </script>

    <style>
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .premium-shadow {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .premium-shadow-lg {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .modal-backdrop {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .status-confirmed {
            border-left: 4px solid #10b981;
        }

        .status-pending {
            border-left: 4px solid #f59e0b;
        }

        .status-cancelled {
            border-left: 4px solid #ef4444;
        }

        .status-completed {
            border-left: 4px solid #7c3aed;
        }

        .status-postponed {
            border-left: 4px solid #f59e0b;
        }

        .back-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .back-btn:hover {
            background: linear-gradient(135deg, #5a67d8 0%, #6b46c1 100%);
            transform: translateY(-1px);
        }

        .mobile-menu-icon {
            position: absolute;
            top: 1rem;
            right: 1rem;
        }

        @media (min-width: 640px) {
            .mobile-menu-icon {
                display: none;
            }
        }

        /* Added loading spinner styles */
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #7c3aed;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
    </style>
  
</head>

<body class="min-h-screen bg-gray-50">
    <!-- Added loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-spinner"></div>
    </div>

    <!-- Notification Container -->
    <div id="notificationContainer"></div>

    <!-- Header -->
    <header class="glass-effect sticky top-0 z-40 premium-shadow">
        <div class="container mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center premium-shadow">
                        <svg class="w-6 h-6 text-primary-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-foreground">Thigazhi Concert Management</h1>
                        <p class="text-sm text-muted-foreground">My Bookings Dashboard</p>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <!-- Back to Home Button -->
                    <button onclick="goHome()" class="back-btn px-4 py-2 text-white rounded-lg font-medium premium-shadow flex items-center space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                        <span>Back to Home</span>
                    </button>
                    <button class="p-2 rounded-lg bg-secondary hover:bg-accent transition-colors premium-shadow">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 100 4m0-4v2m0-6V4"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
        <!-- Booking Overview Section -->
        <div class="mb-8">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-6 space-y-4 sm:space-y-0">
                <h2 class="text-2xl sm:text-3xl font-bold text-foreground">My Bookings</h2>
                <div class="flex space-x-2">
                    <button id="currentTab" class="px-4 sm:px-6 py-2 rounded-lg bg-primary text-primary-foreground font-medium transition-all premium-shadow">
                        Current Bookings
                    </button>
                    <button id="pastTab" class="px-4 sm:px-6 py-2 rounded-lg bg-secondary text-secondary-foreground font-medium hover:bg-accent transition-all">
                        Past Bookings
                    </button>
                </div>
            </div>
        </div>

        <!-- Dynamic content containers -->
        <!-- Current Bookings -->
        <div id="currentBookings" class="space-y-4 sm:space-y-6 animate-fade-in">
            <!-- Dynamic content will be loaded here -->
        </div>

        <!-- Past Bookings -->
        <div id="pastBookings" class="space-y-4 sm:space-y-6 animate-fade-in hidden">
            <!-- Dynamic content will be loaded here -->
        </div>
    </main>

    <!-- Detailed View Modal -->
    <div id="detailModal" class="fixed inset-0 modal-backdrop hidden z-50 flex items-center justify-center p-4">
        <div class="bg-card rounded-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto border border-border animate-scale-in">
            <div class="p-6 border-b border-border">
                <div class="flex items-center justify-between">
                    <h3 class="text-2xl font-bold text-card-foreground">Booking Details</h3>
                    <button onclick="closeModal('detailModal')" class="p-2 rounded-lg bg-secondary hover:bg-accent transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="detailContent" class="p-6">
                <!-- Content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Registration Dashboard Modal -->
    <div id="registrationModal" class="fixed inset-0 modal-backdrop hidden z-50 flex items-center justify-center p-4">
        <div class="bg-card rounded-xl max-w-5xl w-full max-h-[90vh] overflow-y-auto border border-border animate-scale-in">
            <div class="p-6 border-b border-border">
                <div class="flex items-center justify-between">
                    <h3 class="text-2xl font-bold text-card-foreground">Registration Dashboard</h3>
                    <button onclick="closeModal('registrationModal')" class="p-2 rounded-lg bg-secondary hover:bg-accent transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="registrationContent" class="p-6">
                <!-- Content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Postpone Event Modal -->
    <div id="postponeModal" class="fixed inset-0 modal-backdrop hidden z-50 flex items-center justify-center p-4">
        <div class="bg-card rounded-xl max-w-3xl w-full max-h-[90vh] overflow-y-auto border border-border animate-scale-in">
            <div class="p-6 border-b border-border">
                <div class="flex items-center justify-between">
                    <h3 class="text-2xl font-bold text-card-foreground">Postpone Event</h3>
                    <button onclick="closeModal('postponeModal')" class="p-2 rounded-lg bg-secondary hover:bg-accent transition-colors">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
            </div>
            <div id="postponeContent" class="p-6">
                <!-- Content will be populated by JavaScript -->
            </div>
        </div>
    </div>

    <!-- Cancel Event Modal -->
    <div id="cancelModal" class="fixed inset-0 modal-backdrop hidden z-50 flex items-center justify-center p-4">
        <div class="bg-card rounded-xl max-w-md w-full border border-border animate-scale-in">
            <div class="p-6">
                <div class="text-center">
                    <div class="w-16 h-16 bg-destructive/20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-destructive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                        </svg>
                    </div>
                    <h3 class="text-xl font-bold text-card-foreground mb-2">Cancel Event</h3>
                    <p class="text-muted-foreground mb-6">
                        ⚠️ <span id="cancelWarningText">1,250 users</span> are already registered for this event. If you cancel, all registered users will get a full refund.
                    </p>
                    <div class="flex space-x-3">
                        <button onclick="closeModal('cancelModal')" class="flex-1 px-4 py-2 bg-secondary text-secondary-foreground rounded-lg hover:bg-accent transition-colors">
                            Keep Event
                        </button>
                        <button onclick="confirmCancel()" class="flex-1 px-4 py-2 bg-destructive text-destructive-foreground rounded-lg hover:bg-destructive/90 transition-colors">
                            Cancel Event
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_CONFIG = {
            baseURL: 'https://68ca895b430c4476c349e4c0.mockapi.io/MusicEvent/EventData',
            endpoints: {
                eventData: '/2'
            }
        };

        class APIService {
            constructor() {
                this.cache = new Map();
                this.cacheTimeout = 5 * 60 * 1000; // 5 minutes
            }

            async fetchData(endpoint, useCache = true) {
                const cacheKey = endpoint;
                
                if (useCache && this.cache.has(cacheKey)) {
                    const cached = this.cache.get(cacheKey);
                    if (Date.now() - cached.timestamp < this.cacheTimeout) {
                        return cached.data;
                    }
                }

                try {
                    const response = await fetch(`${API_CONFIG.baseURL}${endpoint}`);
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    const data = await response.json();
                    
                    if (useCache) {
                        this.cache.set(cacheKey, {
                            data,
                            timestamp: Date.now()
                        });
                    }
                    
                    return data;
                } catch (error) {
                    console.error('API fetch error:', error);
                    this.showNotification('Failed to fetch data. Please try again.', 'error');
                    throw error;
                }
            }

            async updateData(endpoint, data) {
                try {
                    const response = await fetch(`${API_CONFIG.baseURL}${endpoint}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(data)
                    });
                    
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    
                    const updatedData = await response.json();
                    
                    // Clear cache to force refresh
                    this.cache.clear();
                    
                    return updatedData;
                } catch (error) {
                    console.error('API update error:', error);
                    this.showNotification('Failed to update data. Please try again.', 'error');
                    throw error;
                }
            }

            showNotification(message, type = 'info') {
                const container = document.getElementById('notificationContainer');
                const notification = document.createElement('div');
                
                const bgColor = type === 'error' ? 'bg-destructive' : 
                               type === 'success' ? 'bg-success' : 'bg-primary';
                
                notification.className = `fixed top-4 right-4 ${bgColor} text-white px-6 py-3 rounded-lg premium-shadow-lg z-50 animate-slide-down`;
                notification.textContent = message;
                
                container.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 5000);
            }
        }

        const apiService = new APIService();
        let currentEventData = null;

        async function loadEventData() {
            try {
                showLoading(true);
                currentEventData = await apiService.fetchData(API_CONFIG.endpoints.eventData);
                console.log('Loaded event data:', currentEventData);
                
                renderBookings();
                setupTabSwitching();
                
            } catch (error) {
                console.error('Failed to load event data:', error);
                renderErrorState();
            } finally {
                showLoading(false);
            }
        }

        function showLoading(show) {
            const overlay = document.getElementById('loadingOverlay');
            if (show) {
                overlay.classList.remove('hidden');
            } else {
                overlay.classList.add('hidden');
            }
        }

        function renderErrorState() {
            const currentBookings = document.getElementById('currentBookings');
            currentBookings.innerHTML = `
                <div class="text-center py-12">
                    <div class="w-16 h-16 bg-destructive/20 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-destructive" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                        </svg>
                    </div>
                    <h3 class="text-xl font-semibold text-card-foreground mb-2">Failed to Load Data</h3>
                    <p class="text-muted-foreground mb-4">Unable to fetch booking data. Please check your connection and try again.</p>
                    <button onclick="loadEventData()" class="px-4 py-2 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 transition-colors">
                        Retry
                    </button>
                </div>
            `;
        }

        function renderBookings() {
            if (!currentEventData) return;

            const currentBookings = document.getElementById('currentBookings');
            const pastBookings = document.getElementById('pastBookings');
            
            // Clear existing content
            currentBookings.innerHTML = '';
            pastBookings.innerHTML = '';

            // Process event bookings
            const eventBookings = currentEventData.EventBookings || {};
            const currentBookingsList = [];
            const pastBookingsList = [];

            Object.entries(eventBookings).forEach(([bookingId, booking]) => {
                if (booking.bookingStatus === 'completed') {
                    pastBookingsList.push({ ...booking, bookingId });
                } else {
                    currentBookingsList.push({ ...booking, bookingId });
                }
            });

            // Render current bookings
            if (currentBookingsList.length === 0) {
                currentBookings.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-16 h-16 bg-muted rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                            </svg>
                        </div>
                        <h3 class="text-xl font-semibold text-card-foreground mb-2">No Current Bookings</h3>
                        <p class="text-muted-foreground">You don't have any active bookings at the moment.</p>
                    </div>
                `;
            } else {
                currentBookingsList.forEach(booking => {
                    currentBookings.appendChild(createBookingCard(booking, false));
                });
            }

            // Render past bookings
            if (pastBookingsList.length === 0) {
                pastBookings.innerHTML = `
                    <div class="text-center py-12">
                        <div class="w-16 h-16 bg-muted rounded-full flex items-center justify-center mx-auto mb-4">
                            <svg class="w-8 h-8 text-muted-foreground" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <h3 class="text-xl font-semibold text-card-foreground mb-2">No Past Bookings</h3>
                        <p class="text-muted-foreground">Your completed bookings will appear here.</p>
                    </div>
                `;
            } else {
                pastBookingsList.forEach(booking => {
                    pastBookings.appendChild(createBookingCard(booking, true));
                });
            }
        }

        function createBookingCard(booking, isPast = false) {
            const card = document.createElement('div');
            const venue = getVenueById(booking.venueId);
            const band = getBandById(booking.bandId);
            
            // Format date
            const eventDate = formatEventDate(booking.bookedSlots?.[0] || booking.bookingDate);
            
            // Determine status class and text
            let statusClass = 'status-confirmed';
            let statusText = 'Confirmed';
            let statusColor = 'text-success';
            
            if (booking.bookingStatus === 'cancelled') {
                statusClass = 'status-cancelled';
                statusText = 'Cancelled';
                statusColor = 'text-destructive';
            } else if (booking.bookingStatus === 'postponed') {
                statusClass = 'status-postponed';
                statusText = 'Postponed';
                statusColor = 'text-warning';
            } else if (booking.bookingStatus === 'completed') {
                statusClass = 'status-completed';
                statusText = 'Completed';
                statusColor = 'text-primary';
            } else if (booking.bookingStatus === 'pending') {
                statusClass = 'status-pending';
                statusText = 'Pending';
                statusColor = 'text-warning';
            }

            card.className = `bg-card rounded-xl p-4 sm:p-6 border border-border hover:border-primary/50 transition-all duration-300 premium-shadow hover:premium-shadow-lg ${statusClass} relative`;
            card.id = `card_${booking.bookingId}`;

            const menuId = `menu_${booking.bookingId}`;
            const desktopMenuId = `menu_${booking.bookingId}_desktop`;

            // Show registration button only if ticketing is enabled
            const registrationButton = booking.ticketingEnabled ? 
                `<button onclick="viewRegistrations('${booking.bookingId}')" class="w-full text-left px-4 py-2 hover:bg-accent rounded-t-lg transition-colors">View Registrations</button>` : '';

            card.innerHTML = `
                <!-- Mobile Menu Button -->
                <div class="mobile-menu-icon sm:hidden">
                    <button onclick="toggleMenu('${menuId}')" class="p-2 rounded-lg bg-secondary hover:bg-accent transition-colors border border-border shadow-sm">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01"></path>
                        </svg>
                    </button>
                    <div id="${menuId}" class="absolute right-0 mt-2 w-48 bg-card border border-border rounded-lg premium-shadow-lg hidden z-20">
                        ${registrationButton}
                        ${!isPast && booking.bookingStatus !== 'cancelled' ? `
                            <button onclick="postponeEvent('${booking.bookingId}')" class="w-full text-left px-4 py-2 hover:bg-accent transition-colors">Postpone Event</button>
                            <button onclick="cancelEvent('${booking.bookingId}')" class="w-full text-left px-4 py-2 hover:bg-destructive/20 text-destructive rounded-b-lg transition-colors">Cancel Event</button>
                        ` : ''}
                    </div>
                </div>

                <div class="flex flex-col lg:flex-row lg:items-start justify-between space-y-4 lg:space-y-0 mb-4">
                    <div class="flex-1">
                        <h3 class="text-lg sm:text-xl font-semibold text-card-foreground mb-2">${booking.eventName || 'Unnamed Event'}</h3>
                        <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-4 space-y-2 sm:space-y-0 text-sm text-muted-foreground mb-3">
                            <span class="flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                                <span id="eventDate_${booking.bookingId}">${eventDate}</span>
                            </span>
                            <span class="flex items-center">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                </svg>
                                ${venue?.name || 'Unknown Venue'}
                            </span>
                        </div>
                        <div class="flex flex-col sm:flex-row sm:items-center sm:space-x-6 space-y-2 sm:space-y-0 text-sm">
                            <span id="eventStatus_${booking.bookingId}" class="${statusColor} font-medium">${statusText}</span>
                            <span class="text-muted-foreground">${band?.name || 'Unknown Band'}</span>
                            <span class="text-primary font-semibold">₹${(booking.totalAmount || 0).toLocaleString()}</span>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2">
                        <button onclick="viewDetails('${booking.bookingId}')" class="px-3 sm:px-4 py-2 bg-primary text-primary-foreground rounded-lg hover:bg-primary/90 transition-colors font-medium text-sm">
                            View Details
                        </button>
                        <div class="relative hidden sm:block">
                            <button onclick="toggleMenu('${desktopMenuId}')" class="p-2 rounded-lg bg-secondary hover:bg-accent transition-colors">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01"></path>
                                </svg>
                            </button>
                            <div id="${desktopMenuId}" class="absolute right-0 mt-2 w-48 bg-card border border-border rounded-lg premium-shadow-lg hidden z-10">
                                ${registrationButton}
                                ${!isPast && booking.bookingStatus !== 'cancelled' ? `
                                    <button onclick="postponeEvent('${booking.bookingId}')" class="w-full text-left px-4 py-2 hover:bg-accent transition-colors">Postpone Event</button>
                                    <button onclick="cancelEvent('${booking.bookingId}')" class="w-full text-left px-4 py-2 hover:bg-destructive/20 text-destructive rounded-b-lg transition-colors">Cancel Event</button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `;

            return card;
        }

        function getVenueById(venueId) {
            if (!currentEventData?.Venues) return null;
            return Object.values(currentEventData.Venues).find(venue => venue.id === venueId);
        }

        function getBandById(bandId) {
            if (!currentEventData?.Bands) return null;
            return Object.values(currentEventData.Bands).find(band => band.id === bandId);
        }

        function getDecorationById(decorationId) {
            if (!currentEventData?.Decorations) return null;
            return Object.values(currentEventData.Decorations).find(decoration => decoration.id === decorationId);
        }

        function formatEventDate(dateString) {
            if (!dateString) return 'Date TBD';
            
            // Handle slot format like "2025-09-26-morning"
            if (dateString.includes('-morning') || dateString.includes('-evening') || dateString.includes('-afternoon')) {
                const parts = dateString.split('-');
                if (parts.length >= 3) {
                    const date = new Date(parts[0], parts[1] - 1, parts[2]);
                    const timeOfDay = parts[3] || 'morning';
                    return `${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })} - ${timeOfDay.charAt(0).toUpperCase() + timeOfDay.slice(1)}`;
                }
            }
            
            // Handle regular date format
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return 'Invalid Date';
            
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        async function postponeEvent(bookingId) {
            const booking = getBookingById(bookingId);
            if (!booking) return;

            // Show postpone modal with current data
            showPostponeModal(booking);
        }

        async function cancelEvent(bookingId) {
            const booking = getBookingById(bookingId);
            if (!booking) return;

            // Show cancel modal with registration count
            const registrationCount = getRegistrationCount(booking);
            document.getElementById('cancelWarningText').textContent = `${registrationCount} users`;
            document.getElementById('cancelModal').classList.remove('hidden');
            
            // Store current booking ID for confirmation
            window.currentCancelBookingId = bookingId;
        }

        async function confirmCancel() {
            if (!window.currentCancelBookingId) return;
            
            try {
                showLoading(true);
                
                // Update booking status to cancelled
                const updatedData = { ...currentEventData };
                if (updatedData.EventBookings[window.currentCancelBookingId]) {
                    updatedData.EventBookings[window.currentCancelBookingId].bookingStatus = 'cancelled';
                }
                
                await apiService.updateData(API_CONFIG.endpoints.eventData, updatedData);
                currentEventData = updatedData;
                
                // Close modal and refresh display
                closeModal('cancelModal');
                renderBookings();
                
                apiService.showNotification('Event cancelled successfully. All registered users will receive refunds.', 'success');
                
            } catch (error) {
                console.error('Failed to cancel event:', error);
            } finally {
                showLoading(false);
                window.currentCancelBookingId = null;
            }
        }

        function getBookingById(bookingId) {
            if (!currentEventData?.EventBookings) return null;
            return currentEventData.EventBookings[bookingId];
        }

        function getRegistrationCount(booking) {
            if (!booking.ticketingEnabled) return 0;
            const ticketBookings = currentEventData?.TicketBookings || {};
            return Object.keys(ticketBookings).length;
        }

        function setupTabSwitching() {
            const currentTab = document.getElementById('currentTab');
            const pastTab = document.getElementById('pastTab');
            const currentBookings = document.getElementById('currentBookings');
            const pastBookings = document.getElementById('pastBookings');

            currentTab.addEventListener('click', () => {
                currentTab.className = 'px-4 sm:px-6 py-2 rounded-lg bg-primary text-primary-foreground font-medium transition-all premium-shadow';
                pastTab.className = 'px-4 sm:px-6 py-2 rounded-lg bg-secondary text-secondary-foreground font-medium hover:bg-accent transition-all';
                
                currentBookings.classList.remove('hidden');
                pastBookings.classList.add('hidden');
            });

            pastTab.addEventListener('click', () => {
                pastTab.className = 'px-4 sm:px-6 py-2 rounded-lg bg-primary text-primary-foreground font-medium transition-all premium-shadow';
                currentTab.className = 'px-4 sm:px-6 py-2 rounded-lg bg-secondary text-secondary-foreground font-medium hover:bg-accent transition-all';
                
                pastBookings.classList.remove('hidden');
                currentBookings.classList.add('hidden');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            console.log('Dynamic Concert Management Dashboard initializing...');
            loadEventData();
        });

        setInterval(() => {
            if (!document.hidden) {
                loadEventData();
            }
        }, 30000);
    </script>
</body>
</html>
