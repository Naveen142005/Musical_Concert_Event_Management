<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Enhanced Concert Venue Card</title>
</head>
<body class="bg-gradient-to-br from-purple-900 via-purple-700 to-indigo-900 min-h-screen p-8 flex items-center justify-center">
    
    <article class="group slide-in-left bg-white/20 backdrop-blur-md border border-white/30 rounded-2xl p-8 overflow-hidden shadow-2xl shadow-purple-500/25 w-full max-w-sm mx-auto flex flex-col transform transition-all duration-300 hover:scale-105 hover:shadow-purple-500/40 hover:-translate-y-2">
        
        <!-- Image Section with Overlay -->
        <div class="relative mb-6 overflow-hidden rounded-xl">
            <img src="./ASSETS/Band1.jpg" alt="Grand Hall Venue" class="lazy-image w-full h-48 object-cover transition-transform duration-500 group-hover:scale-110">
            <div class="absolute inset-0 bg-gradient-to-t from-purple-900/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
            <div class="absolute top-3 right-3">
                <div class="w-3 h-3 rounded-full bg-green-400 animate-pulse shadow-lg shadow-green-400/50"></div>
            </div>
        </div>
        
        <!-- Content Section -->
        <div class="flex flex-col flex-grow space-y-4">
            
            <!-- Title Section -->
            <div class="flex flex-col items-start">
                <h3 class="text-xl font-bold bg-gradient-to-r from-purple-700 to-purple-500 bg-clip-text text-transparent mb-3 group-hover:from-purple-600 group-hover:to-purple-400 transition-all duration-300">
                    Grand Hall Venue
                </h3>
                <div class="flex items-center gap-2 text-white/90">
                    <svg class="w-4 h-4 text-purple-400" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M18 3a1 1 0 00-1.196-.98l-10 2A1 1 0 006 5v6.114a4 4 0 103 3.886V6.114l8-1.6v4.774a4 4 0 103 3.886V3z"/>
                    </svg>
                    <p class="text-sm font-medium">Indian Rock</p>
                </div>
            </div>
            
            <!-- Details Section -->
            <div class="space-y-3">
                
                <!-- Members -->
                <div class="flex items-center gap-3 p-3 rounded-lg bg-white/10 backdrop-blur-sm border border-white/20 transition-all duration-300 hover:bg-white/20 hover:scale-105">
                    <div class="flex-shrink-0">
                        <svg class="w-5 h-5 text-purple-300" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                    </div>
                    <div class="flex-grow">
                        <h4 class="text-sm font-semibold text-white/90">Members</h4>
                        <p class="text-lg font-bold text-purple-200">9 Artists</p>
                    </div>
                </div>
                
                <!-- Price -->
                <div class="flex items-center gap-3 p-3 rounded-lg bg-white/10 backdrop-blur-sm border border-white/20 transition-all duration-300 hover:bg-white/20 hover:scale-105">
                    <div class="flex-shrink-0">
                        <svg class="w-5 h-5 text-green-400" fill="currentColor" viewBox="0 0 20 20">
                            <path d="M8.433 7.418c.155-.103.346-.196.567-.267v1.698a2.305 2.305 0 01-.567-.267C8.07 8.34 8 8.114 8 8c0-.114.07-.34.433-.582zM11 12.849v-1.698c.22.071.412.164.567.267.364.243.433.468.433.582 0 .114-.07.34-.433.582a2.305 2.305 0 01-.567.267z"/>
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-13a1 1 0 10-2 0v.092a4.535 4.535 0 00-1.676.662C6.602 6.234 6 7.009 6 8c0 .99.602 1.765 1.324 2.246.48.32 1.054.545 1.676.662v1.941c-.391-.127-.68-.317-.843-.504a1 1 0 10-1.51 1.31c.562.649 1.413 1.076 2.353 1.253V15a1 1 0 102 0v-.092a4.535 4.535 0 001.676-.662C13.398 13.766 14 12.991 14 12c0-.99-.602-1.765-1.324-2.246A4.535 4.535 0 0011 9.092V7.151c.391.127.68.317.843.504a1 1 0 101.51-1.31c-.562-.649-1.413-1.076-2.353-1.253V5z"/>
                        </svg>
                    </div>
                    <div class="flex-grow">
                        <h4 class="text-sm font-semibold text-white/90">Hourly Rate</h4>
                        <p class="text-lg font-bold text-green-300">$13/Hour</p>
                    </div>
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="flex justify-between items-center pt-4 gap-4">
                
                <!-- Check Availability -->
                <button class="group/check flex items-center gap-2 text-sm font-semibold text-purple-300 border-b-2 border-purple-300 pb-1 hover:text-purple-200 hover:border-purple-200 transition-all duration-300">
                    <svg class="w-4 h-4 transition-transform duration-300 group-hover/check:scale-110" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z"/>
                    </svg>
                    <span>Check Availability</span>
                </button>
                
                <!-- Book Now Button -->
                <button class="relative overflow-hidden rounded-full px-6 py-3 text-sm text-white font-semibold bg-gradient-to-r from-purple-600 to-purple-700 hover:from-purple-700 hover:to-purple-800 shadow-lg shadow-purple-500/30 hover:shadow-purple-500/50 transition-all duration-300 transform hover:scale-105 group/book">
                    <div class="absolute inset-0 bg-white/20 translate-x-[-100%] group-hover/book:translate-x-0 transition-transform duration-500"></div>
                    <span class="relative z-10">Book Now</span>
                </button>
            </div>
        </div>
    </article>
</body>
</html>
